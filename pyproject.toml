[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapemaster"
version = "0.8.6"
authors = [
    { name="ParisNeo", email="parisneo_ai@gmail.com" },
]
description = "A versatile web scraping library with GUI, async support, and multi-strategy fetching"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9" 
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Desktop Environment :: Application Launchers",
]

dependencies = [
    "requests>=2.25.1",
    "beautifulsoup4>=4.9.3",
    "lxml>=4.6.3",
    "selenium>=4.10.0",
    "webdriver-manager>=4.0.0",
    "undetected-chromedriver>=3.1.5",
    "markdownify>=0.11.6",
    "pipmaster>=0.7.0",
    "ascii_colors>=0.10.0",
    "youtube-transcript-api>=0.6.0",
    "wikipedia>=1.4.0",
    "pypdf>=3.0.0",
    "python-docx>=0.8.11"
]

[project.optional-dependencies]
# Async support for high-performance bulk scraping
async = [
    "aiohttp>=3.8.0",
]
# Modern browser automation (recommended over Selenium)
playwright = [
    "playwright>=1.40.0",
]
# TLS fingerprint spoofing for advanced bot bypass
tls = [
    "curl_cffi>=0.6.0",
]
# GUI support (PySide6 for LGPL compatibility)
gui = [
    "PySide6>=6.0.0",
    "markdown>=3.3.0",
]
# Development tools
dev = [
    "pytest>=6.2.4",
    "pytest-asyncio>=0.21.0",
    "flake8>=3.9.2",
    "black>=22.3.0",
    "pytest-mock>=3.6.1",
]

[project.scripts]
scrapemaster-gui = "scrapemaster.gui:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*", "examples", "examples.*", "venv*", "*.venv*", "env*", "*.env*"]

[tool.black]
line-length = 88